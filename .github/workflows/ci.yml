name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CalculiX and system libraries
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libgl1 libxcursor1 libxft2 libxinerama1 libgomp1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests and the cantilever benchmark against beam theory
        run: pytest -q
      - name: CAM program (toolpath, gouge check, G-code)
        run: python -m vanefea.cam --out /tmp/cam/vane.nc
